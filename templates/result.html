<!DOCTYPE html>
<html>
<head>
    <title>Email Classification Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 700px;
            max-width: 90%;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .email-box {
            background: #f1f3f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            word-wrap: break-word;
        }

        .email-box p {
            margin-bottom: 0;
            line-height: 1.6;
        }

        .result {
            text-align: center;
            padding: 30px;
            border-radius: 12px;
            background: #f8f9fa;
        }

        .prediction {
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .percentage {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        .bar {
            width: 100%;
            height: 25px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
        }

        .true-bar {
            height: 100%;
            background: #28a745;
        }

        .false-bar {
            height: 100%;
            background: #dc3545;
        }

        .back {
            display: block;
            width: 200px;
            margin: 30px auto 0;
            padding: 12px;
            text-align: center;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Email Classification Result</h1>

    <div class="email-box">
        <strong>Email:</strong>
        <p>{{ email }}</p>
    </div>

    <div class="result">

        <div class="prediction">
            {{ prediction }}
        </div>

        <div class="percentage">
            True — {{ true_percentage }}%
        </div>

        <div class="bar">
            <div
                class="true-bar"
                style="width: {{ true_percentage }}%;">
            </div>
        </div>

        <div class="percentage">
            False — {{ false_percentage }}%
        </div>

        <div class="bar">
            <div
                class="false-bar"
                style="width: {{ false_percentage }}%;">
            </div>
        </div>

    </div>

    <a href="/" class="back">Check Another Email</a>

</div>

</body>
</html>
